[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-router"
dynamic = ["version"]
description = "Local proxy that filters personal data out of Codex and Claude Code requests before they reach a cloud model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["truststore>=0.9"]

[project.optional-dependencies]
spacy = ["presidio-analyzer>=2.2", "spacy>=3.7"]
gliner = ["gliner>=0.2.13"]
hf = ["transformers>=4.38", "torch>=2.2"]
pdf = ["pypdf>=4"]
test = ["pytest>=7"]

[project.scripts]
pii-router = "pii_router.cli:main"

[project.urls]
Homepage = "https://github.com/jirbis/pii-router"

[tool.setuptools]
packages = ["pii_router"]

[tool.setuptools.dynamic]
version = {attr = "pii_router.__version__"}

[tool.setuptools.package-data]
pii_router = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
